[project]
name = "agentcore-restore-data"
version = "1.0.0"
description = "Restore tool for AgentCore Public Stack — reads a backup manifest and imports data into a deployed two-stack environment"
requires-python = ">=3.13"
dependencies = [
    "boto3==1.43.9",
    "botocore==1.43.9",
]

[dependency-groups]
dev = [
    "moto[dynamodb,s3,cognitoidp,ssm]==5.1.4",
    "pytest==9.0.3",
]

[tool.uv]
package = false

# Security: constrain transitive cryptography to patched OpenSSL (GHSA-537c-gmf6-5ccf)
# and to the PKCS#7 Bleichenbacher-oracle fix (CVE-2026-69247), patched in 50.0.0.
# Security: constrain moto's transitive joserfc (dev only) past GHSA-jpxq-7h8p-2q76
# (JWE recipients CPU DoS, 1.7.5) and GHSA-9pg5-8c7x-5hfx (compact JWS size guard, 1.7.6).
constraint-dependencies = ["cryptography>=50.0.1", "joserfc>=1.7.6"]
