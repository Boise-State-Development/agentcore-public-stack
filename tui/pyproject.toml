[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore-tui"
version = "1.14.1"
requires-python = ">=3.11"
description = "Terminal client for the AgentCore Public Stack — streaming AI chat in your terminal"
readme = "README.md"
license = { text = "PolyForm Noncommercial License 1.0.0" }
keywords = ["tui", "terminal", "bedrock", "agentcore", "llm", "chat"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

# Runtime deps are deliberately minimal: fewer wheels means a faster `uvx`
# cold start and a smaller PyInstaller bundle. Config parsing uses stdlib
# `tomllib` (3.11+) rather than adding a TOML dependency.
dependencies = [
    "textual==8.2.8",
    # Matches backend/pyproject.toml so the monorepo resolves one httpx.
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "keyring==25.7.0",
    "platformdirs==4.11.0",
]

[project.optional-dependencies]
# Dev tooling versions are pinned to match backend/pyproject.toml so lint and
# format behaviour is identical across the monorepo.
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "black==26.3.1",
    "ruff==0.15.12",
    "mypy==1.20.2",
]

[project.scripts]
agentcore-tui = "agentcore_tui.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentcore_tui*"]

[tool.setuptools.package-data]
agentcore_tui = ["*.tcss"]

[tool.black]
line-length = 150
target-version = ['py311']

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# Greenfield package — no legacy to grandfather in, so require annotations.
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
