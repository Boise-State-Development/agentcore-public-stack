# Reusable test gates (pytest / vitest / jest / xcodebuild). Callers pick suites via the
# run_* inputs; unselected jobs are skipped.

name: Tests

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (empty = the ref that triggered the caller)'
        required: false
        default: ''
        type: string
      run_backend:
        description: 'Run backend pytest suite'
        required: false
        default: false
        type: boolean
      run_backend_contracts:
        description: 'Run only the backend suites that read the CDK tree, scripts and workflows (supply_chain, architecture); a no-op when run_backend is also set'
        required: false
        default: false
        type: boolean
      run_frontend:
        description: 'Run frontend test suite'
        required: false
        default: false
        type: boolean
      run_frontend_coverage:
        description: 'Run the frontend suite a second time under --coverage (the nightly invocation)'
        required: false
        default: false
        type: boolean
      run_infra:
        description: 'Run infrastructure jest suite'
        required: false
        default: false
        type: boolean
      run_ios:
        description: 'Run the iOS client suite (swift format lint + xcodebuild test in the simulator, unsigned) on a macOS runner'
        required: false
        default: false
        type: boolean
      run_load_unit:
        description: 'Run load-test unit suite (pure logic; no AWS, no load generated)'
        required: false
        default: false
        type: boolean
      run_scripts:
        description: 'Run operational script unit suites (restore-data; stubbed boto3, no AWS)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-backend:
    if: ${{ inputs.run_backend }}
    name: Test backend (pytest)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.7.12'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - name: Sync deps
        working-directory: backend
        run: uv sync --extra agentcore --extra dev
      - name: Run pytest
        working-directory: backend
        # `-n logical` fans the suite across every vCPU (pytest-xdist). Not
        # `auto`: with psutil installed, `auto` counts PHYSICAL cores, and the
        # 4-vCPU runner reports 2, so it started 2 workers for ~11k tests
        # (`created: 2/2 workers` in the log). Verbosity/--tb live in
        # backend/pytest.ini. The nightly coverage run (scripts/backend/test.sh)
        # is deliberately left serial.
        run: uv run pytest tests/ -n logical
      # The repo-ROOT supply-chain suite (not backend/tests/supply_chain):
      # cross-package contracts that read CDK, the backup/restore scripts and
      # the python env-var readers side by side, so it lives above backend/.
      # Nothing ran it before this step, and it rotted twice unnoticed. It
      # is pure stdlib + pytest, so it borrows the backend venv synced above;
      # --no-sync keeps uv from re-resolving that env without its extras.
      # Scoped to supply_chain/ because tests/load has its own deps and job.
      - name: Run root supply-chain pytest
        run: uv run --project backend --no-sync pytest tests/supply_chain/ -v

  # The subset of the backend suite that reads OUTSIDE backend/: the
  # supply-chain and architecture tests assert against the CDK tree, the
  # scripts and the workflows side by side with the Python that consumes
  # them, so an infrastructure-only PR still needs them — and nothing else in
  # backend/tests/. About a hundred tests, well under a minute, against seven
  # minutes for the full suite. Skipped whenever run_backend is set, because
  # the full run already covers it.
  test-backend-contracts:
    if: ${{ inputs.run_backend_contracts && !inputs.run_backend }}
    name: Test backend contracts (pytest)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.7.12'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - name: Sync deps
        working-directory: backend
        run: uv sync --extra agentcore --extra dev
      - name: Run backend contract suites
        working-directory: backend
        run: uv run pytest tests/supply_chain/ tests/architecture/ -v
      - name: Run root supply-chain pytest
        run: uv run --project backend --no-sync pytest tests/supply_chain/ -v

  test-frontend:
    if: ${{ inputs.run_frontend }}
    name: Test frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/ai.client/package-lock.json
      - name: Install
        working-directory: frontend/ai.client
        run: npm ci --prefer-offline
      - name: Run tests
        working-directory: frontend/ai.client
        run: npm run test:ci

  # The SAME frontend suite, run the way the nightly runs it: `ng test
  # --no-watch --coverage`, via the very script nightly.yml invokes.
  #
  # Why this is a separate gate rather than a flag on `test:ci`: under
  # --coverage, @angular/build's unit-test builder bundles each spec into a
  # flattened chunk emitted at the PROJECT ROOT instead of handing Vitest the
  # spec at its own source path. `import.meta.url` and the `__dirname` shim
  # move with it, so every filesystem-reading spec resolves relative paths
  # from a different directory than it does without coverage. That is a real
  # failure mode with no watered-down version — a doc-presence spec reads the
  # wrong README and a hygiene guard walks generated CSS and "finds"
  # violations — and until this job existed NOTHING on a pull request ever
  # passed --coverage, so the class could only be discovered by the nightly,
  # after merge. It went undetected for seven consecutive nights.
  #
  # It is its own job, and enabled only on the PR gate (ci.yml), because the
  # deploy workflows run `test-frontend` to protect a deploy and gain nothing
  # from paying for instrumentation there. Running in parallel with
  # test-frontend costs no extra wall-clock on the PR.
  #
  # Coverage artifacts are deliberately NOT uploaded here: the nightly owns
  # coverage *reporting* (analyze-coverage compares runs over time). This job
  # only cares that the suite passes under the instrumented build.
  test-frontend-coverage:
    if: ${{ inputs.run_frontend_coverage }}
    name: Test frontend (coverage build)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/ai.client/package-lock.json
      - name: Install
        working-directory: frontend/ai.client
        run: npm ci --prefer-offline
      - name: Run tests with coverage
        run: bash scripts/frontend/test.sh

  test-infra:
    if: ${{ inputs.run_infra }}
    name: Test infrastructure (jest)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json
      - name: Install
        working-directory: infrastructure
        run: npm ci --prefer-offline
      - name: Type-check (tsc --noEmit)
        working-directory: infrastructure
        # Single shared type-check for the whole project. jest now transpiles
        # only (isolatedModules), so this is where infra type errors are caught
        # on a PR — cheaper once here than re-run inside every jest worker.
        run: npm run build
      - name: Run tests
        working-directory: infrastructure
        run: npx jest --maxWorkers=2

  # Unit tests for tests/load — the SSE parser, the Cognito login-form parser,
  # and the config guards. Pure logic: no AWS credentials, no network, and no
  # load is generated, so this is safe on every PR.
  #
  # Why it is a gate at all: the locustfiles encode the chat path's request
  # payload and SSE event names. Renaming an event in
  # agents/main_agent/streaming/ or changing the /chat/stream contract should
  # fail here rather than silently produce a load test that reports every turn
  # as never finishing. Running the actual load test needs provisioned Cognito
  # users and spends real Bedrock tokens — that is never done in CI.
  test-ios:
    if: ${{ inputs.run_ios }}
    name: Test iOS client (xcodebuild)
    # GitHub's Xcode-specific arm64 image, pinned by major version (not the
    # floating macos-latest; see test_runner_pinning.py). The project needs
    # Xcode 26 or newer (swift-tools-version 6.2).
    runs-on: xcode-27
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Lint (swift format, ships with Xcode)
        run: swift format lint --strict --recursive --parallel AgentCore AgentCoreKit
      - name: Pick the newest iPhone simulator on the image
        id: sim
        run: |
          udid="$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | sort_by(.name) | last | .udid')"
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "::error::no available iPhone simulator on this image"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test (simulator, unsigned)
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        # CODE_SIGNING_ALLOWED=NO: the simulator needs no identity and the
        # runner has none. The scheme's test action runs the AgentCoreKit
        # package tests (Swift Testing). The WORKSPACE, not the project: a
        # local package's test target is only a testable when the package is
        # a workspace member; `-project` reports "no test bundles available".
        run: |
          xcodebuild test \
            -workspace AgentCore.xcworkspace \
            -scheme AgentCore \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO

  test-load-unit:
    if: ${{ inputs.run_load_unit }}
    name: Test load suite (pytest)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.7.12'
          enable-cache: true
          cache-dependency-glob: 'tests/load/uv.lock'
      - name: Sync deps
        working-directory: tests/load
        run: uv sync
      - name: Run pytest
        working-directory: tests/load
        run: uv run pytest tests/ -v
      - name: Verify locustfiles import
        working-directory: tests/load
        # `--list` loads each locustfile and prints its user classes without
        # starting a run. Catches an import error or a scenario accidentally
        # made abstract, which the unit tests would not.
        run: |
          uv run locust -f locustfile.py --list
          uv run locust -f locustfile_readonly.py --list

  # Unit tests for the operational data scripts. scripts/restore-data has 48
  # tests (test_restore.py) covering manifest indirection, sub remapping and
  # Cognito/Memory replay; nothing ran them, so they could only rot between
  # the rare real restores. scripts/backup-data has no tests of its own — its
  # cross-script contract lives in tests/supply_chain/test_backup_coverage.py,
  # which test-backend already runs.
  #
  # Syncs the script's OWN uv project rather than borrowing the backend venv:
  # restore-data.yml runs restore.py against this lockfile's boto3/botocore,
  # so that is the pair worth testing. --frozen installs the lock as-is.
  #
  # Offline by construction: every AWS call goes through a MagicMock session
  # or a patched get_ssm_param, and this job has no AWS credentials. Disabling
  # IMDS keeps an accidental unmocked call from stalling on a metadata probe.
  test-scripts:
    if: ${{ inputs.run_scripts }}
    name: Test operational scripts (pytest)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.7.12'
          enable-cache: true
          cache-dependency-glob: 'scripts/restore-data/uv.lock'
      - name: Sync restore-data deps
        working-directory: scripts/restore-data
        run: uv sync --frozen
      - name: Run restore-data pytest
        working-directory: scripts/restore-data
        run: uv run --frozen pytest test_restore.py -v
