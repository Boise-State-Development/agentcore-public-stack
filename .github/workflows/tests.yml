# Reusable test suites (pytest / vitest / jest).
#
# Single source of truth for the unit-test gates that the deploy workflows
# (platform.yml, backend.yml, frontend-deploy.yml), the PR gate (ci.yml), and
# the nightly deploy pipeline all share. Each caller selects which suites to
# run via the run_* booleans; unselected jobs are skipped (if:).
#
# This is a reusable workflow (workflow_call) — it inherits concurrency from
# its caller and is therefore exempt from the cancel-in-progress rule enforced
# by tests/supply_chain/test_concurrency_config.py. It touches no AWS and needs
# no secrets.

name: Tests

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (empty = the ref that triggered the caller)'
        required: false
        default: ''
        type: string
      run_backend:
        description: 'Run backend pytest suite'
        required: false
        default: false
        type: boolean
      run_frontend:
        description: 'Run frontend test suite'
        required: false
        default: false
        type: boolean
      run_infra:
        description: 'Run infrastructure jest suite'
        required: false
        default: false
        type: boolean
      label:
        description: 'Optional prefix for job display names (e.g. a nightly track label)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  test-backend:
    if: ${{ inputs.run_backend }}
    name: "${{ inputs.label != '' && format('[{0}] ', inputs.label) || '' }}Test backend (pytest)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.7.12'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - name: Sync deps
        working-directory: backend
        run: uv sync --extra agentcore --extra dev
      - name: Run pytest
        working-directory: backend
        run: uv run pytest tests/ -v

  test-frontend:
    if: ${{ inputs.run_frontend }}
    name: "${{ inputs.label != '' && format('[{0}] ', inputs.label) || '' }}Test frontend"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/ai.client/package-lock.json
      - name: Install
        working-directory: frontend/ai.client
        run: npm ci --prefer-offline
      - name: Run tests
        working-directory: frontend/ai.client
        run: npm run test:ci

  test-infra:
    if: ${{ inputs.run_infra }}
    name: "${{ inputs.label != '' && format('[{0}] ', inputs.label) || '' }}Test infrastructure (jest)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json
      - name: Install
        working-directory: infrastructure
        run: npm ci --prefer-offline
      - name: Run tests
        working-directory: infrastructure
        run: npx jest --maxWorkers=2
