# Reusable test gates (pytest / vitest / jest). Callers pick suites via the
# run_* inputs; unselected jobs are skipped.

name: Tests

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (empty = the ref that triggered the caller)'
        required: false
        default: ''
        type: string
      run_backend:
        description: 'Run backend pytest suite'
        required: false
        default: false
        type: boolean
      run_frontend:
        description: 'Run frontend test suite'
        required: false
        default: false
        type: boolean
      run_frontend_coverage:
        description: 'Run the frontend suite a second time under --coverage (the nightly invocation)'
        required: false
        default: false
        type: boolean
      run_infra:
        description: 'Run infrastructure jest suite'
        required: false
        default: false
        type: boolean
      run_load_unit:
        description: 'Run load-test unit suite (pure logic; no AWS, no load generated)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-backend:
    if: ${{ inputs.run_backend }}
    name: Test backend (pytest)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.7.12'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - name: Sync deps
        working-directory: backend
        run: uv sync --extra agentcore --extra dev
      - name: Run pytest
        working-directory: backend
        run: uv run pytest tests/ -v

  test-frontend:
    if: ${{ inputs.run_frontend }}
    name: Test frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/ai.client/package-lock.json
      - name: Install
        working-directory: frontend/ai.client
        run: npm ci --prefer-offline
      - name: Run tests
        working-directory: frontend/ai.client
        run: npm run test:ci

  # The SAME frontend suite, run the way the nightly runs it: `ng test
  # --no-watch --coverage`, via the very script nightly.yml invokes.
  #
  # Why this is a separate gate rather than a flag on `test:ci`: under
  # --coverage, @angular/build's unit-test builder bundles each spec into a
  # flattened chunk emitted at the PROJECT ROOT instead of handing Vitest the
  # spec at its own source path. `import.meta.url` and the `__dirname` shim
  # move with it, so every filesystem-reading spec resolves relative paths
  # from a different directory than it does without coverage. That is a real
  # failure mode with no watered-down version — a doc-presence spec reads the
  # wrong README and a hygiene guard walks generated CSS and "finds"
  # violations — and until this job existed NOTHING on a pull request ever
  # passed --coverage, so the class could only be discovered by the nightly,
  # after merge. It went undetected for seven consecutive nights.
  #
  # It is its own job, and enabled only on the PR gate (ci.yml), because the
  # deploy workflows run `test-frontend` to protect a deploy and gain nothing
  # from paying for instrumentation there. Running in parallel with
  # test-frontend costs no extra wall-clock on the PR.
  #
  # Coverage artifacts are deliberately NOT uploaded here: the nightly owns
  # coverage *reporting* (analyze-coverage compares runs over time). This job
  # only cares that the suite passes under the instrumented build.
  test-frontend-coverage:
    if: ${{ inputs.run_frontend_coverage }}
    name: Test frontend (coverage build)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/ai.client/package-lock.json
      - name: Install
        working-directory: frontend/ai.client
        run: npm ci --prefer-offline
      - name: Run tests with coverage
        run: bash scripts/frontend/test.sh

  test-infra:
    if: ${{ inputs.run_infra }}
    name: Test infrastructure (jest)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json
      - name: Install
        working-directory: infrastructure
        run: npm ci --prefer-offline
      - name: Run tests
        working-directory: infrastructure
        run: npx jest --maxWorkers=2

  # Unit tests for tests/load — the SSE parser, the Cognito login-form parser,
  # and the config guards. Pure logic: no AWS credentials, no network, and no
  # load is generated, so this is safe on every PR.
  #
  # Why it is a gate at all: the locustfiles encode the chat path's request
  # payload and SSE event names. Renaming an event in
  # agents/main_agent/streaming/ or changing the /chat/stream contract should
  # fail here rather than silently produce a load test that reports every turn
  # as never finishing. Running the actual load test needs provisioned Cognito
  # users and spends real Bedrock tokens — that is never done in CI.
  test-load-unit:
    if: ${{ inputs.run_load_unit }}
    name: Test load suite (pytest)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.7.12'
          enable-cache: true
          cache-dependency-glob: 'tests/load/uv.lock'
      - name: Sync deps
        working-directory: tests/load
        run: uv sync
      - name: Run pytest
        working-directory: tests/load
        run: uv run pytest tests/ -v
      - name: Verify locustfiles import
        working-directory: tests/load
        # `--list` loads each locustfile and prints its user classes without
        # starting a run. Catches an import error or a scenario accidentally
        # made abstract, which the unit tests would not.
        run: |
          uv run locust -f locustfile.py --list
          uv run locust -f locustfile_readonly.py --list
