name: Platform Stack

on:
  workflow_dispatch:
  # Deploy on pushes to the CDK stack or its deploy plumbing.
  push:
    branches: [develop, main]
    paths:
      - 'infrastructure/lib/platform-stack.ts'
      - 'infrastructure/lib/constructs/**'
      - 'infrastructure/lib/config.ts'
      - 'infrastructure/bin/infrastructure.ts'
      - 'infrastructure/bootstrap-assets/**'
      - 'scripts/platform/**'
      - '.github/workflows/platform.yml'

permissions:
  contents: read

env:
  CDK_REQUIRE_APPROVAL: never
  LOAD_ENV_QUIET: true

# Shared "deploy-<ref>" group with backend.yml so a CFN deploy and the
# API-driven backend code deploys never mutate the same ECS service /
# AgentCore Runtime / Lambda concurrently — they queue instead.
# cancel-in-progress: false avoids leaving CloudFormation in
# ROLLBACK_IN_PROGRESS / UPDATE_ROLLBACK_FAILED after a mid-deploy cancel.
# Enforced by tests/supply_chain/test_concurrency_config.py.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-infra:
    name: Test infrastructure (jest)
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      run_infra: true

  deploy:
    name: Deploy PlatformStack
    needs: test-infra
    runs-on: ubuntu-24.04
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      # Environment-scoped configuration (MUST be at job level with environment: set)
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      CDK_DOMAIN_NAME: ${{ vars.CDK_DOMAIN_NAME }}
      CDK_CORS_ORIGINS: ${{ vars.CDK_CORS_ORIGINS }}
      CDK_VPC_CIDR: ${{ vars.CDK_VPC_CIDR }}
      CDK_ALB_SUBDOMAIN: ${{ vars.CDK_ALB_SUBDOMAIN }}
      CDK_CERTIFICATE_ARN: ${{ vars.CDK_CERTIFICATE_ARN }}
      # Shared us-east-1 CloudFront cert (wildcard covering {domain} + *.{domain}).
      # Each CloudFront origin (SPA / artifacts / mcp-sandbox) falls back to this
      # when its section-specific cert var is unset, so one wildcard satisfies all
      # three. A section-specific var still overrides per origin.
      CDK_CLOUDFRONT_CERTIFICATE_ARN: ${{ vars.CDK_CLOUDFRONT_CERTIFICATE_ARN }}
      CDK_RETAIN_DATA_ON_DELETE: ${{ vars.CDK_RETAIN_DATA_ON_DELETE }}
      # Whether CDK creates Route53 records for the SPA/ALB/artifacts/mcp-sandbox
      # origins. Set to "false" when the hosted zone for CDK_DOMAIN_NAME lives in
      # a different AWS account (records are then created manually from the
      # deploy's CfnOutputs). Defaults to true.
      CDK_MANAGE_DNS_RECORDS: ${{ vars.CDK_MANAGE_DNS_RECORDS }}
      # AgentCore Gateway inbound authorizer: "iam" (default) or "jwt".
      # The authorizer is IMMUTABLE after Gateway creation — the AgentCore
      # control plane rejects a change on an existing Gateway. Leave unset (or
      # "iam") for any environment whose Gateway already exists; "jwt" only
      # applies to a newly created Gateway.
      CDK_GATEWAY_INBOUND_AUTH: ${{ vars.CDK_GATEWAY_INBOUND_AUTH }}
      # RFC 8693 token exchange (optional). Leave both unset unless the
      # organisation runs a token service with a token-exchange endpoint; the
      # feature is dormant when the URL is empty. Not secrets — the client
      # secret itself lives in Secrets Manager and is populated out of band.
      CDK_TOKEN_EXCHANGE_URL: ${{ vars.CDK_TOKEN_EXCHANGE_URL }}
      CDK_TOKEN_EXCHANGE_CLIENT_ID: ${{ vars.CDK_TOKEN_EXCHANGE_CLIENT_ID }}
      CDK_HOSTED_ZONE_DOMAIN: ${{ vars.CDK_HOSTED_ZONE_DOMAIN }}
      CDK_COGNITO_DOMAIN_PREFIX: ${{ vars.CDK_COGNITO_DOMAIN_PREFIX }}
      CDK_COGNITO_CALLBACK_URLS: ${{ vars.CDK_COGNITO_CALLBACK_URLS }}
      CDK_COGNITO_LOGOUT_URLS: ${{ vars.CDK_COGNITO_LOGOUT_URLS }}
      CDK_COGNITO_SUPPORTED_IDPS: ${{ vars.CDK_COGNITO_SUPPORTED_IDPS }}
      CDK_ARTIFACTS_CERTIFICATE_ARN: ${{ vars.CDK_ARTIFACTS_CERTIFICATE_ARN }}
      # Extra origins allowed to frame the artifacts iframe via CSP
      # frame-ancestors (beyond the deployed SPA origin) — e.g.
      # http://localhost:4200 for a local SPA pointed at this deployment.
      # Empty on prod. Mirrors CDK_MCP_SANDBOX_EXTRA_FRAME_ANCESTORS below.
      CDK_ARTIFACTS_EXTRA_FRAME_ANCESTORS: ${{ vars.CDK_ARTIFACTS_EXTRA_FRAME_ANCESTORS }}
      CDK_FRONTEND_CERTIFICATE_ARN: ${{ vars.CDK_FRONTEND_CERTIFICATE_ARN }}
      # MCP Apps sandbox-proxy origin (mcp-sandbox.{domain}). Without the
      # cert ARN the construct silently falls back to the CloudFront default
      # domain and creates no Route53 ALIAS — the SPA then frames a
      # nonexistent host and MCP Apps fail to load. Cert MUST be in us-east-1.
      CDK_MCP_SANDBOX_CERTIFICATE_ARN: ${{ vars.CDK_MCP_SANDBOX_CERTIFICATE_ARN }}
      CDK_MCP_SANDBOX_EXTRA_FRAME_ANCESTORS: ${{ vars.CDK_MCP_SANDBOX_EXTRA_FRAME_ANCESTORS }}
      # KB sync scheduled re-index. Default ON with a kill switch: CDK enables
      # the EventBridge rate(15m) rule + KB_SYNC_ENABLED on both kb-sync
      # Lambdas UNLESS this is set to "false". Unset resolves to empty string,
      # which config.ts treats as the default (on). Set the
      # `CDK_KB_SYNC_ENABLED` variable to "false" in an environment only to
      # dark-stop the feature there.
      CDK_KB_SYNC_ENABLED: ${{ vars.CDK_KB_SYNC_ENABLED }}
      # Scheduled runs (headless "Run now" + grant routes, and the Phase-B
      # scheduler when it lands). Default ON with a kill switch: unset
      # resolves to empty string, which config.ts treats as the default
      # (on). Set the `CDK_SCHEDULED_RUNS_ENABLED` variable to "false" in
      # an environment only to dark-stop the feature there.
      CDK_SCHEDULED_RUNS_ENABLED: ${{ vars.CDK_SCHEDULED_RUNS_ENABLED }}
      # Memory Spaces (user-owned markdown "second brain" + agent binding).
      # Default ON with a kill switch: unset resolves to empty string, which
      # config.ts treats as the default (on). Set the `CDK_MEMORY_SPACES_ENABLED`
      # variable to "false" in an environment only to dark-stop the feature there.
      CDK_MEMORY_SPACES_ENABLED: ${{ vars.CDK_MEMORY_SPACES_ENABLED }}
      # Skills v2 (knowledge bundles: admin catalog, My Skills authoring, and
      # skill resolution on the invocation path). Default ON with a kill switch:
      # unset resolves to empty string, which config.ts treats as the default
      # (on). Set the `CDK_SKILLS_ENABLED` variable to "false" in an environment
      # only to dark-stop the feature there. NOTE this is the ONLY gate on the
      # user-facing surfaces — with it on, any signed-in user can author skills
      # and see the ones their role grants. Which skills a cohort gets is a
      # role's `grantedSkills`, managed in the admin roles UI.
      CDK_SKILLS_ENABLED: ${{ vars.CDK_SKILLS_ENABLED }}
      # Agent Designer /agents surface. Default OFF (opt-in) until the Phase-4
      # Designer UI ships — a headless API helps no forker. Set the
      # `CDK_AGENTS_API_ENABLED` variable to "true" in an environment (e.g. dev)
      # to enable it there for dogfooding.
      CDK_AGENTS_API_ENABLED: ${{ vars.CDK_AGENTS_API_ENABLED }}
      # MCP user-identity forwarding — optional Cognito Pre-Token-Generation v2
      # Lambda that copies user attributes into access-token claims so
      # personalized MCP tools can identify the caller
      # (docs/specs/MCP_USER_IDENTITY_FORWARDING_SPEC.md). Default OFF (opt-in):
      # unset resolves to empty string, which config.ts treats as disabled, so
      # NO Lambda/trigger is created. Set `CDK_MCP_TOKEN_ENRICHMENT_ENABLED` to
      # "true" AND provide the claim map in `CDK_MCP_TOKEN_ENRICHMENT_CLAIMS`
      # (a JSON object {namespacedClaimName: sourceCognitoAttribute}, e.g.
      # {"https://boisestate.edu/employee_number":"custom:provider_sub"}) to
      # enable it. Keeping the map in a variable lets the public
      # cdk.context.json stay inert.
      CDK_MCP_TOKEN_ENRICHMENT_ENABLED: ${{ vars.CDK_MCP_TOKEN_ENRICHMENT_ENABLED }}
      CDK_MCP_TOKEN_ENRICHMENT_CLAIMS: ${{ vars.CDK_MCP_TOKEN_ENRICHMENT_CLAIMS }}
      # Managed knowledge bases (.kiro/specs/managed-kb-migration). THREE
      # INDEPENDENT OPT-IN flags, all defaulting to OFF — the inverse of the
      # kill-switch flags above, and the difference matters here. An unset
      # GitHub Actions variable renders as an EMPTY STRING, not as absent, so
      # a `!== 'false'` reading of an unset variable would resolve to TRUE and
      # arm the feature on every fork. config.ts reads these with
      # parseBooleanEnv, which maps both unset and empty to undefined and falls
      # through to `false` (Requirement 19.8). Leave all three unset to deploy
      # the managed backend without starting a fleet migration.
      #
      #   CDK_MANAGED_KB_NEW_DEFAULT       new KBs are created managed
      #   CDK_MANAGED_KB_MIGRATION_ENABLED the background migrator runs at all
      #   CDK_MANAGED_KB_RECONCILER_ARMED  the daily reconciler DELETES orphans
      #                                    rather than only reporting them
      #
      # reconcilerArmed is the inverted one: the Reconciler is deployed and
      # running from day one but DISARMED, so its judgement can be reviewed
      # against real data before it deletes anything (Requirements 14.7, 19.7).
      CDK_MANAGED_KB_NEW_DEFAULT: ${{ vars.CDK_MANAGED_KB_NEW_DEFAULT }}
      CDK_MANAGED_KB_MIGRATION_ENABLED: ${{ vars.CDK_MANAGED_KB_MIGRATION_ENABLED }}
      CDK_MANAGED_KB_RECONCILER_ARMED: ${{ vars.CDK_MANAGED_KB_RECONCILER_ARMED }}
      # Storage cost controls. Byte_Caps are in BYTES (Requirement 12.2),
      # defaulting to 100 MB standard / 1 GB elevated / 500 MB per knowledge
      # base; the retention window is in DAYS and must stay >= 30
      # (Requirement 15.11). Leave unset to take those defaults — these exist
      # so an environment can tune them without a code change.
      CDK_MANAGED_KB_PER_OWNER_BYTES: ${{ vars.CDK_MANAGED_KB_PER_OWNER_BYTES }}
      CDK_MANAGED_KB_PER_OWNER_ELEVATED_BYTES: ${{ vars.CDK_MANAGED_KB_PER_OWNER_ELEVATED_BYTES }}
      CDK_MANAGED_KB_PER_KB_CEILING_BYTES: ${{ vars.CDK_MANAGED_KB_PER_KB_CEILING_BYTES }}
      CDK_MANAGED_KB_RETENTION_WINDOW_DAYS: ${{ vars.CDK_MANAGED_KB_RETENTION_WINDOW_DAYS }}
      # Fleet-level alarm thresholds (Requirement 12.13). The Byte_Caps above
      # bound ONE owner; these two bound the whole account, which is the gap
      # between ~$169/month expected and ~$15,000/month that per-owner caps
      # alone permit. Storage is in GB (default 500), daily cost in USD
      # (default 100). Leave unset to take those defaults.
      CDK_MANAGED_KB_STORAGE_ALARM_GB: ${{ vars.CDK_MANAGED_KB_STORAGE_ALARM_GB }}
      CDK_MANAGED_KB_DAILY_COST_ALARM_USD: ${{ vars.CDK_MANAGED_KB_DAILY_COST_ALARM_USD }}
      # Secrets
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pin the toolchain the deploy uses (npm ci + cdk run inside
      # scripts/platform/deploy.sh). Without this the deploy job runs on
      # the runner's ambient Node, drifting from the Node 22 every other
      # job pins — and from the devcontainer. cache: npm warms the install.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - uses: ./.github/actions/configure-aws-credentials
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy PlatformStack
        run: bash scripts/platform/deploy.sh
