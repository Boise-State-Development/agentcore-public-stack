name: Backend Deploy

on:
  workflow_dispatch:
  # Deploy on pushes to backend code or its build plumbing.
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'scripts/build/**'
      # recover-evicted-deploy.sh runs in THIS workflow. A change to the
      # guard that re-dispatches an evicted peer deploy must itself be
      # exercised by a real run.
      - 'scripts/ci/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

env:
  CDK_REQUIRE_APPROVAL: never
  LOAD_ENV_QUIET: true

# Shared "deploy-<ref>" group with platform.yml so a CFN deploy and these
# API-driven code deploys never mutate the same ECS service / AgentCore
# Runtime / Lambda concurrently.
#
# ⚠️ The group does NOT queue — it is a latch with a queue depth of one, so
# a third run entering it cancels whichever run was pending, before that run
# executes a job. See the longer note in platform.yml and the
# `recover-evicted-peer` job below, which re-dispatches a peer deploy this
# run evicted. Enforced by backend/tests/supply_chain/test_concurrency_config.py.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# ------------------------------------------------------------
# This workflow has one job per Docker image so the dashboard
# shows three independent build statuses (Build app-api,
# Build inference-api, Build rag-ingestion). Each build job
# computes a content hash of its image's input surface and
# skips the actual `docker build` + `docker push` when ECR
# already has an image with that tag — so a check-in that
# only touches one service rebuilds only that one image.
#
# All three build jobs are independent and run in parallel.
# The deploy job waits on all three so we can be sure every
# image's content-hash tag is in SSM before CDK reads it at
# synth time.
# ------------------------------------------------------------

jobs:
  # Recover a peer deploy that GitHub silently evicted from the shared
  # "deploy-<ref>" concurrency group when THIS run claimed the pending slot.
  # A concurrency group is a latch with a queue depth of ONE, not a queue:
  # "any existing pending job or workflow in the same concurrency group will
  # be canceled and the new queued job or workflow will take its place." So a
  # third run entering an occupied group kills whichever run was waiting,
  # before it executes a single job, leaving a `cancelled` conclusion that is
  # indistinguishable from a human pressing Cancel.
  #
  # That is harmless when the evicted run is superseded by a LATER run of the
  # SAME workflow (both deploy the tree at HEAD, and git is cumulative). It is
  # destructive across workflows: a Platform Stack run does not ship
  # container images or Lambda code, so when it evicts a pending Backend
  # Deploy run that code is simply never shipped and CI stays green.
  #
  # No `needs`, so the recovery dispatch goes out at the top of the run rather
  # than behind the deploy it is unrelated to. The re-dispatched run queues
  # behind this one, so the concurrency guarantee is preserved.
  # See scripts/ci/recover-evicted-deploy.sh.
  # Enforced by backend/tests/supply_chain/test_concurrency_config.py.
  recover-evicted-peer:
    name: Recover evicted peer deploy
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      # `gh workflow run` re-dispatches the peer workflow.
      actions: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Detect and recover an evicted Platform Stack run
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/recover-evicted-deploy.sh platform.yml

  test-infra:
    name: Test infrastructure (jest)
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      run_infra: true

  test-backend:
    name: Test backend (pytest)
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      run_backend: true

  build-app-api:
    name: Build app-api image
    needs: test-backend
    runs-on: ubuntu-24.04
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_AWS_ACCOUNT }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/build-and-push-image
        id: build
        with:
          image-name: app-api
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  build-inference-api:
    name: Build inference-api image
    needs: test-backend
    # Native ARM64 runner — the AgentCore Runtime is arm64. Build
    # natively here rather than emulating arm64 on amd64 via QEMU
    # (matches the pre-refactor inference-api.yml on main).
    runs-on: ubuntu-24.04-arm
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_AWS_ACCOUNT }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/build-and-push-image
        id: build
        with:
          image-name: inference-api
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  build-rag-ingestion:
    name: Build rag-ingestion image
    needs: test-backend
    # Native ARM64 runner — the RAG ingestion Lambda is arm64. Building
    # on amd64 (the previous runs-on) produced an amd64 image that the
    # arm64 Lambda rejected at init with Runtime.InvalidEntrypoint.
    # Matches the pre-refactor rag-ingestion.yml on main.
    runs-on: ubuntu-24.04-arm
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_AWS_ACCOUNT }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/build-and-push-image
        id: build
        with:
          image-name: rag-ingestion
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  build-kb-sync:
    name: Build kb-sync image
    needs: test-backend
    # Native ARM64 runner — both kb-sync Lambdas are arm64 (see the
    # kb-sync CDK construct), matching the rag-ingestion pattern.
    runs-on: ubuntu-24.04-arm
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_AWS_ACCOUNT }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/build-and-push-image
        id: build
        with:
          image-name: kb-sync
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-kb-sync-code:
    name: Deploy kb-sync Lambda images
    # One image, two functions: dispatcher + worker share the kb-sync
    # image and differ only in ImageConfig.Command (CDK-owned), so a
    # single job points both at the freshly-built tag.
    needs: [build-kb-sync, test-backend]
    runs-on: ubuntu-24.04
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_AWS_ACCOUNT }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/configure-aws-credentials
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Deploy kb-sync dispatcher image
        run: bash scripts/build/deploy-image-lambda-one.sh kb-sync-dispatcher
      - name: Deploy kb-sync worker image
        run: bash scripts/build/deploy-image-lambda-one.sh kb-sync-worker

  build-kb-migration:
    name: Build kb-migration image
    needs: test-backend
    # Native ARM64 runner — all five kb-migration Lambdas are arm64 (see the
    # managed-kb CDK construct), matching the kb-sync pattern.
    runs-on: ubuntu-24.04-arm
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_AWS_ACCOUNT }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/build-and-push-image
        id: build
        with:
          image-name: kb-migration
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-kb-migration-code:
    name: Deploy kb-migration Lambda images
    # ONE image, FIVE functions: dispatcher, worker, reconciler, document
    # reconciler and ingestion consumer share the kb-migration image and differ
    # only in ImageConfig.Command (CDK-owned), so a single job points all five at
    # the freshly-built tag.
    #
    # This is the job that replaces the bootstrap stub
    # (infrastructure/bootstrap-assets/kb-migration/) with the real handlers.
    # Until it has run once, an enrolled knowledge base sits in `shadow` while
    # the dispatcher ticks into a no-op — safe, because the work keys are sparse
    # and the first real tick picks up everything that accumulated.
    needs: [build-kb-migration, test-backend]
    runs-on: ubuntu-24.04
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_AWS_ACCOUNT }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/configure-aws-credentials
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Deploy kb-migration dispatcher image
        run: bash scripts/build/deploy-image-lambda-one.sh kb-migration-dispatcher
      - name: Deploy kb-migration worker image
        run: bash scripts/build/deploy-image-lambda-one.sh kb-migration-worker
      - name: Deploy kb-migration reconciler image
        run: bash scripts/build/deploy-image-lambda-one.sh kb-migration-reconciler
      - name: Deploy kb-migration document reconciler image
        run: bash scripts/build/deploy-image-lambda-one.sh kb-migration-document-reconciler
      - name: Deploy kb-migration ingestion consumer image
        run: bash scripts/build/deploy-image-lambda-one.sh kb-migration-ingestion-consumer

  build-conversation-index:
    name: Build conversation-index image
    needs: test-backend
    # Native ARM64 runner — the consumer Lambda is arm64 (see the
    # conversation-index CDK construct), matching the kb-migration pattern.
    runs-on: ubuntu-24.04-arm
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_AWS_ACCOUNT }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/build-and-push-image
        id: build
        with:
          image-name: conversation-index
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-conversation-index-code:
    name: Deploy conversation-index Lambda image
    # Replaces the bootstrap stub (infrastructure/bootstrap-assets/conversation-index/)
    # with the real consumer. Until it has run once, the stub returns every
    # queue message as failed, so archived turns wait on the queue rather than
    # being acknowledged unindexed. On the PR that introduces the function the
    # platform deploy has not published its SSM name yet, and the deploy script
    # skips gracefully; the next backend run completes the swap.
    needs: [build-conversation-index, test-backend]
    runs-on: ubuntu-24.04
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_AWS_ACCOUNT }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/configure-aws-credentials
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Deploy conversation-index consumer image
        run: bash scripts/build/deploy-image-lambda-one.sh conversation-index-consumer
      # Same image, second function (ImageConfig.Command selects the handler).
      - name: Deploy conversation-index reconciler image
        run: bash scripts/build/deploy-image-lambda-one.sh conversation-index-reconciler

  build-scheduled-runs:
    name: Build scheduled-runs image
    needs: test-backend
    # Native ARM64 runner — both scheduled-runs Lambdas are arm64 (see the
    # scheduled-runs CDK construct), matching the kb-sync pattern.
    runs-on: ubuntu-24.04-arm
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_AWS_ACCOUNT }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/build-and-push-image
        id: build
        with:
          image-name: scheduled-runs
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-scheduled-runs-code:
    name: Deploy scheduled-runs Lambda images
    # One image, two functions: dispatcher + worker share the
    # scheduled-runs image and differ only in ImageConfig.Command
    # (CDK-owned), so a single job points both at the freshly-built tag.
    needs: [build-scheduled-runs, test-backend]
    runs-on: ubuntu-24.04
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_AWS_ACCOUNT }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/configure-aws-credentials
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Deploy scheduled-runs dispatcher image
        run: bash scripts/build/deploy-image-lambda-one.sh scheduled-runs-dispatcher
      - name: Deploy scheduled-runs worker image
        run: bash scripts/build/deploy-image-lambda-one.sh scheduled-runs-worker

  deploy-artifact-render-code:
    name: Deploy artifact-render Lambda code
    # Lambda zip code deploy. Mirrors the build-* jobs but for a
    # zip-based Lambda whose configuration lives in PlatformStack
    # with a stable bootstrap zip; this step ships the real handler
    # code via `aws lambda update-function-code` if its content hash
    # has changed since last deploy.
    needs: test-backend
    runs-on: ubuntu-24.04
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_AWS_ACCOUNT }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    outputs:
      code_hash: ${{ steps.deploy.outputs.code_hash }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/configure-aws-credentials
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Deploy artifact-render code
        id: deploy
        run: bash scripts/build/deploy-zip-lambda-one.sh artifact-render

  deploy-rag-ingestion-code:
    name: Deploy rag-ingestion Lambda image
    # Image-Lambda code deploy. The image was already built and
    # pushed by the build-rag-ingestion job; this step points the
    # Lambda at the new tag via `aws lambda update-function-code
    # --image-uri`. Mirrors deploy-artifact-render-code, but for
    # a DockerImage Lambda whose code lives in ECR.
    needs: [build-rag-ingestion, test-backend]
    runs-on: ubuntu-24.04
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_AWS_ACCOUNT }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    outputs:
      image_tag: ${{ steps.deploy.outputs.image_tag }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/configure-aws-credentials
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Deploy rag-ingestion image
        id: deploy
        run: bash scripts/build/deploy-image-lambda-one.sh rag-ingestion

  deploy-inference-api-code:
    name: Deploy inference-api image to AgentCore Runtime
    # Phase 5 of the platform-as-bootstrap refactor: the AgentCore
    # Runtime is configured in CDK with a stable bootstrap container
    # image; this step ships the real image via
    # `aws bedrock-agentcore-control update-agent-runtime`. Mirrors
    # deploy-rag-ingestion-code but for a Runtime instead of a Lambda.
    needs: [build-inference-api, test-backend]
    runs-on: ubuntu-24.04
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_AWS_ACCOUNT }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    outputs:
      image_tag: ${{ steps.deploy.outputs.image_tag }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/configure-aws-credentials
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Deploy inference-api image
        id: deploy
        run: bash scripts/build/deploy-runtime-image-one.sh inference-api

  deploy-app-api-code:
    name: Deploy app-api image to ECS Fargate service
    # Phase 6 of the platform-as-bootstrap refactor: the App API
    # task definition is built in CDK with a stable bootstrap
    # container image; this step ships the real image via
    # `aws ecs register-task-definition` (registers a new revision
    # of the same family) followed by `aws ecs update-service` and
    # `aws ecs wait services-stable`.
    needs: [build-app-api, test-backend]
    runs-on: ubuntu-24.04
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    permissions:
      id-token: write
      contents: read

    env:
      CDK_AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_AWS_ACCOUNT: ${{ vars.CDK_AWS_ACCOUNT }}
      CDK_PROJECT_PREFIX: ${{ vars.CDK_PROJECT_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_AWS_ACCOUNT }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    outputs:
      image_tag: ${{ steps.deploy.outputs.image_tag }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/configure-aws-credentials
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Deploy app-api image
        id: deploy
        run: bash scripts/build/deploy-ecs-service-one.sh app-api
