name: "New Feature Flags"

# Release gate: a release that adds a feature flag must say so in RELEASE_NOTES.md.
#
# New features default OFF so that half-finished work never switches itself on
# for the organizations that build on this stack. The other half of that rule is
# that a finished feature nobody is told about never gets turned on. The release
# notes are the only place an operator reads before they deploy, so every new flag
# has to be named there with its default and what setting it does.
#
# This only triggers on PRs into `main`, for the same reason the backfill gate
# does: whoever built the feature set the variable on the `development` GitHub
# environment the day they built it, so dev always has it. Prod and every other
# deployment are the environments nobody told.
#
# The failure mode is silent. An un-set flag is not an error; it is the default.
#
# The same job also lists every SPA flag that is on in prod but off by default
# (environment.production.ts vs environment.ts) and requires the newest
# RELEASE_NOTES.md entry to account for each one, so a feature we turned on for
# ourselves and meant to promote "later" is asked about at every release. The
# list and each flag's promotion condition live in issue #1798.
#
# See .claude/skills/cutting-a-release/SKILL.md §1c.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Safe to cancel superseded runs: this reads a git diff and a markdown file and
# does no AWS work, so there is no deploy hazard in interrupting it.
concurrency:
  group: new-feature-flags-${{ github.ref }}
  cancel-in-progress: true

jobs:
  new-feature-flags:
    name: New Feature Flags
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: |
          git fetch origin main

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      # Diffs feature_flags.py and feature-flags.ts between origin/main and this PR
      # and requires each ADDED flag (backend `*_ENABLED` variable, SPA
      # `FeatureFlags` field) to be named in RELEASE_NOTES.md. No install needed —
      # both sides are already in git.
      #
      # This gate cannot verify the flag was SET anywhere; no CI job can know
      # that. It guarantees the decision reaches the person who makes it.
      - name: Check new feature flags
        id: flag-check
        continue-on-error: true
        run: |
          node scripts/release/check-new-feature-flags.mjs --base origin/main \
            2>&1 | tee /tmp/flag-check-output.txt

          # tee masks the script's exit status, so read it back from PIPESTATUS.
          exit "${PIPESTATUS[0]}"

      - name: Generate summary
        if: always()
        run: |
          source scripts/common/summary.sh

          if [ "${{ steps.flag-check.outcome }}" = "success" ]; then
            STATUS="success"
          else
            STATUS="failure"
          fi

          write_workflow_header "New Feature Flags" "${STATUS}"

          {
            echo '```'
            cat /tmp/flag-check-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo ""
            if [ "${STATUS}" != "success" ]; then
              echo "Either this release adds a feature flag that the release notes do not name,"
              echo "or a flag that is on in prod but off by default is not accounted for in the"
              echo "newest release-notes entry. For a new flag: add it with its default, the"
              echo "services it is set on, the CDK_* variable and SPA field that set it, and"
              echo "whether it is a feature switch or a rollout switch. For a promotion candidate:"
              echo "promote it in this release, or name it under 'Still opt-in' with the reason"
              echo "(tracking issue #1798). Read the output above for which."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Evaluate result
        run: |
          if [ "${{ steps.flag-check.outcome }}" != "success" ]; then
            echo "::error::RELEASE_NOTES.md does not name a new feature flag, or does not account for a flag that is on in prod but off by default (#1798). See the step output and .claude/skills/cutting-a-release/SKILL.md §1c."
            exit 1
          fi
          echo "New-feature-flag check passed."
