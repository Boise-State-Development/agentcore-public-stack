name: "Release"

permissions:
  contents: read

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-tui:
    name: Build terminal client (aps-tui)
    # The TUI is not published to a package index. Its wheel is attached to
    # the release below and installed by URL; see tui/README.md. Same guard as
    # the release job, so forks do not build an artifact nothing will publish.
    if: ${{ github.repository == 'Boise-State-Development/agentcore-public-stack' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Test and build
        run: bash scripts/tui/build.sh --check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aps-tui-dist
          path: |
            tui/dist/aps_tui-*
            tui/dist/SHA256SUMS
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create Release
    needs: build-tui
    # Don't create releases/tags in forks.
    if: ${{ github.repository == 'Boise-State-Development/agentcore-public-stack' }}
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

          # Detect pre-release versions (alpha, beta, rc, dev)
          if echo "${VERSION}" | grep -qE '(alpha|beta|rc|dev)'; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if tag already exists
        id: check-tag
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.TAG }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.TAG }} already exists — skipping release."
            echo "EXISTS=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXISTS=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes
        if: steps.check-tag.outputs.EXISTS == 'false'
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ steps.version.outputs.TAG }}"
          NOTES_FILE=$(mktemp)

          # Extract the section for this version from RELEASE_NOTES.md
          # Matches from "# Release Notes — v<VERSION>" up to the next "# Release Notes —" or EOF
          awk -v ver="${TAG}" '
            BEGIN { found=0 }
            /^# Release Notes — / {
              if (found) exit
              if (index($0, ver)) { found=1; next }
            }
            found { print }
          ' RELEASE_NOTES.md > "${NOTES_FILE}"

          # Trim leading/trailing blank lines
          sed -i '/./,$!d' "${NOTES_FILE}"          # trim leading blanks
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' "${NOTES_FILE}"  # trim trailing blanks

          if [ ! -s "${NOTES_FILE}" ]; then
            echo "⚠️ No release notes found for ${TAG} in RELEASE_NOTES.md"
            echo "Release ${VERSION}" > "${NOTES_FILE}"
          fi

          echo "NOTES_FILE=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        if: steps.check-tag.outputs.EXISTS == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.TAG }}" -m "Release ${{ steps.version.outputs.VERSION }}"
          git push origin "${{ steps.version.outputs.TAG }}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.check-tag.outputs.EXISTS == 'false'
        with:
          name: aps-tui-dist
          path: tui-dist

      - name: Create GitHub Release
        if: steps.check-tag.outputs.EXISTS == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          VERSION="${{ steps.version.outputs.VERSION }}"
          PRERELEASE="${{ steps.version.outputs.PRERELEASE }}"
          NOTES_FILE="${{ steps.notes.outputs.NOTES_FILE }}"

          # The terminal client's install line, under the notes. The wheel is
          # the same for every deployment; the base URL is given at login.
          WHEEL="$(basename tui-dist/aps_tui-*.whl)"
          {
            echo
            echo "## Terminal client"
            echo
            echo "Install or upgrade \`aps-tui\` (needs [uv](https://docs.astral.sh/uv/)):"
            echo
            echo '```bash'
            echo "uv tool install --force https://github.com/${{ github.repository }}/releases/download/${TAG}/${WHEEL}"
            echo "aps-tui login --sso --base-url https://<your-deployment>/api"
            echo '```'
          } >> "${NOTES_FILE}"

          ARGS=(
            "${TAG}"
            --title "Release ${VERSION}"
            --notes-file "${NOTES_FILE}"
            --verify-tag
          )

          if [ "${PRERELEASE}" = "true" ]; then
            ARGS+=( --prerelease )
          fi

          gh release create "${ARGS[@]}" tui-dist/aps_tui-* tui-dist/SHA256SUMS

      - name: Generate summary
        if: always()
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          VERSION="${{ steps.version.outputs.VERSION }}"
          EXISTS="${{ steps.check-tag.outputs.EXISTS }}"

          {
            if [ "${EXISTS}" = "true" ]; then
              echo "## ⏭️ Release Skipped"
              echo ""
              echo "Tag \`${TAG}\` already exists — no release created."
            else
              echo "## 🏷️ Release Created"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| **Tag** | \`${TAG}\` |"
              echo "| **Version** | \`${VERSION}\` |"
              echo "| **Pre-release** | ${{ steps.version.outputs.PRERELEASE }} |"
              echo "| **Release URL** | [${TAG}](https://github.com/${{ github.repository }}/releases/tag/${TAG}) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
