<!-- Mobile sidenav overlay -->
@if (sidenavService.isVisible() && !chromeHidden()) {
    <div class="relative z-50 lg:hidden" role="dialog" aria-modal="true">
      <!-- Backdrop -->
      <div
        [class]="sidenavService.isOpen() ? 'sidenav-backdrop-enter' : 'sidenav-backdrop-exit'"
        class="fixed inset-0 bg-gray-900/80"
        (click)="sidenavService.close()"
        aria-hidden="true">
      </div>

      <div class="fixed inset-0 flex">
        <!-- Sidenav panel -->
        <div
          [class]="sidenavService.isOpen() ? 'sidenav-panel-enter' : 'sidenav-panel-exit'"
          [attr.inert]="sidenavService.isOpen() ? null : ''"
          class="relative mr-16 flex w-full max-w-xs flex-1">
          <!-- Close button -->
          <div class="absolute left-full top-0 flex w-16 justify-center pt-5">
            <button type="button" (click)="sidenavService.close()" class="-m-2.5 p-2.5">
              <span class="sr-only">Close sidebar</span>
              <svg class="size-6 text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
          <app-sidenav></app-sidenav>
        </div>
      </div>
    </div>
  }

  <!-- Static sidebar for desktop. Collapsing only slides it off-screen, so
       `inert` takes the hidden panel (its buttons, links and row menus)
       out of the tab order and the accessibility tree until it is expanded. -->
  @if (!chromeHidden()) {
    <div
      class="hidden lg:fixed lg:inset-y-0 lg:z-50 lg:flex size-auto transition-transform duration-300"
      [class.-translate-x-full]="sidenavService.isCollapsed()"
      [attr.inert]="sidenavService.isCollapsed() ? '' : null">
      <!-- Sidenav component -->
      <app-sidenav></app-sidenav>
    </div>
  }

  <!-- The sidebar's stand-in while it is out of view: one capsule, drawn
       once, in the same corner on every page. Below lg the sidebar is an
       overlay, so the capsule shows whenever that overlay is closed; from lg
       up it shows while the sidebar is collapsed. The admin console carries
       its own small-screen bar with an opener (AdminLayout), so the capsule
       stays out of its way there. The conversation header leaves room for
       it with the reserve variable from styles.css. -->
  @if (!chromeHidden()) {
    <app-shell-controls
      class="fixed top-2.5 left-(--shell-controls-inset) z-50"
      [class.max-lg:hidden]="sidenavService.isVisible() || adminChrome()"
      [class.lg:hidden]="!sidenavService.isCollapsed()" />
  }

  <div
    class="transition-[padding] duration-300"
    [style.--artifact-pane-width]="artifactPaneWidthCss()"
    [class.lg:pl-72]="!sidenavService.isCollapsed() && !chromeHidden()"
    [class.lg:pl-0]="sidenavService.isCollapsed() || chromeHidden()"
    [class.artifact-pane-open]="artifactPanelOpen()">
    <main class="flex h-dvh flex-col">
      <!-- Scrollable Content. The id is a stable hook for code that reads
           or sets the scroll position (RouteScrollService across routes, and
           the session page's own save/restore) — the window itself no longer
           scrolls now that this container is real. -->
      <div id="app-scroll-container" class="flex-1 overflow-y-auto">
        <!-- A minimal-chrome route (e.g. a shared artifact) opts out of
             the centred, padded content box so its own layout can fill
             the shell edge to edge. An admin-chrome route keeps the shell
             but drops the box too: the console owns its own padding, and
             its widest surfaces are the point of the page. -->
        <div
          [class]="
            minimalChrome() || adminChrome()
              ? 'h-full'
              : 'mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-10'
          "
        >
          <router-outlet />
        </div>
      </div>
    </main>
  </div>

  <!-- Global error toast notifications -->
  <app-error-toast />

  <!-- Global toast notifications -->
  <app-toast />

  <!-- Persistent background-task toasts (headless runs, etc.) -->
  <app-background-task-toasts />
