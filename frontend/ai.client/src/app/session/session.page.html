  [showScopePicker]="true"
  [messages]="messages()"

  [draftKey]="draftKey()"
  [assistant]="assistant()"
  [project]="composerProject()"
  [agent]="agent()"
  [boundAgentId]="binding.boundAgentId()"
  [hasUrlBinding]="binding.hasUrlBinding()"
  [runnability]="runnability()"
  [assistantError]="bindingError()"
  [isLoadingAssistant]="isLoadingAssistant()"
  [isChatLoading]="isChatLoading()"
  [isLoadingSession]="showSkeleton()"
  [streamingMessageId]="streamingMessageId()"
  [greetingMessage]="greetingMessage()"
  [config]="chatConfig"
  (messageSubmitted)="onMessageSubmitted($event)"
  (continueRequested)="onContinueRequested()"
  (outageRetryRequested)="onOutageRetryRequested()"
  (messageCancelled)="onMessageCancelled()"
  (fileAttached)="onFileAttached($event)"
  (assistantClosed)="closeAssistant()"
  (assistantNewSession)="newAssistantSession()"
  (assistantEdit)="editAssistant()"
  (assistantShare)="shareAssistant()"
