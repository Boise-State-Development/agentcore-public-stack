[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore-stack"
version = "1.30.0"
requires-python = ">=3.10"
description = "Multi-agent conversational AI system with AWS Bedrock AgentCore"
readme = "README.md"
license = {text = "MIT"}

# Core dependencies shared across both APIs
dependencies = [
    # FastAPI and web framework
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",

    # AWS and cloud services
    "boto3==1.43.103",

    # Utilities
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "aiofiles==25.1.0",

    # Authentication (for shared auth module)
    "pyjwt[crypto]==2.15.0",

    # OAuth provider management
    "authlib==1.7.1",
    "cachetools==6.2.4",

    # Security: pin starlette to fix Dependabot alert (transitive via fastapi)
    "starlette==1.3.1",

    # Security: pin transitive deps to fix Dependabot alerts
    "pillow==12.3.0",
    # Reads .xlsx workbooks into rows for the UI's spreadsheet preview
    # (apis/app_api/files/sheet_preview.py). MIT, pure Python, one
    # dependency (et-xmlfile). Already the library our own
    # create_excel_spreadsheet tool drives inside Code Interpreter, and
    # the one the RAG ingestion image uses via docling — this pin brings
    # it into app-api's own closure, which it was not in before.
    "openpyxl==3.1.5",
    "cryptography==50.0.1",
    "python-multipart==0.0.31",
    "aiohttp==3.14.3",
    "urllib3==2.8.0",
    "idna==3.20",
    "pyasn1==0.6.4",
    "soupsieve==2.9.0",
    # Transitive via starlette/httpx/fastapi. Pinned to 4.14.2 for
    # GHSA-82r6-8w77-94w6 (TLSStream IDNA 2003 host-name encoding allowed
    # TLS certificate spoofing for internationalized domain names).
    "anyio==4.14.2",

    # PDF page-1 rasterization for attachment thumbnails (Apache 2.0 / BSD).
    # Bundles PDFium (no system poppler/ghostscript needed).
    "pypdfium2==4.30.0",

    # Web-source crawler: link extraction + main-content -> markdown.
    "beautifulsoup4==4.13.5",
    "trafilatura==2.0.0",
]

[project.optional-dependencies]
# AgentCore-specific dependencies (for inference_api)
agentcore = [
    "strands-agents==1.57.2",
    "strands-agents-tools==0.8.8",

    "aws-opentelemetry-distro==0.19.0",
    "bedrock-agentcore==1.24.0",
    # Multi-provider LLM support
    "openai==2.32.0",  # For OpenAI models
    "google-genai==1.73.1",  # For Google Gemini models
    # Mints Bedrock Mantle bearer tokens for Strands' bedrock_mantle_config
    # (OpenAIModel / OpenAIResponsesModel). Bounded >=1.1.0,<2.0.0 by strands.
    "aws-bedrock-token-generator==1.1.0",
]

# Voice/BidiAgent dependencies (Nova Sonic speech-to-speech)
bidi = [
    "strands-agents[bidi]==1.57.2",
]

# Document ingestion pipeline dependencies (for Lambda deployment)
# NOTE: For document ingestion dependencies, see:
#   backend/src/apis/app_api/documents/ingestion/requirements.txt
# This is the single source of truth for the Lambda deployment.
# For local development: uv pip install -r backend/src/apis/app_api/documents/ingestion/requirements.txt

# Development dependencies
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    # Parallelises the suite across CPU cores (CI runs `pytest -n auto`). The
    # tests are xdist-safe: moto mocks and hypothesis are per-worker, and no
    # test mutates shared on-disk state.
    "pytest-xdist==3.6.1",
    "hypothesis==6.152.3",
    "moto[dynamodb,cognitoidp]==5.1.22",
    "black==26.3.1",
    "ruff==0.15.12",
    "mypy==1.20.2",
    "types-aiofiles==25.1.0.20260409",
    "tiktoken==0.12.0",
    "numpy==2.2.6",
    # Exercises the fine-tuning dataset contract (manifest reading, label
    # normalisation, the image-archive path). The SageMaker containers install
    # their own unpinned pandas; 2.x is what the py3.10 text DLC resolves to,
    # and it is the only line compatible with the numpy pin above — pandas 3.x
    # requires numpy>=2.3.3 on py3.14+.
    "pandas==2.3.3",
]

# All dependencies (convenience)
all = [
    "agentcore-stack[agentcore,bidi,dev]",
]

[tool.uv]
# Exact pins on TRANSITIVE dependencies — the MCP SDK line is chosen here.
#
# `mcp` arrives only via `strands-agents`; we do not depend on it directly and
# deliberately do not promote it to a direct dependency. `strands-agents==1.57.2`
# declares `mcp>=1.23.0,<2.2`, so without this constraint the resolver would
# move the SDK whenever it got the chance. 2.1.1 is the newest release inside
# that range: it negotiates MCP 2026-07-28 (`server/discover`, per-request
# `_meta` capabilities, multi-round-trip input requests), and Strands'
# `strands/tools/mcp/_compat.py` adapts to it (`MCP_V2`).
#
# Our own seams on the SDK are in `src/agents/main_agent/integrations/`:
# `mcp_apps.py` substitutes `strands.tools.mcp.mcp_client.ClientSession` with
# `_UIExtensionClientSession` to advertise the MCP Apps UI extension (SEP-1865),
# and `mcp_transport.py` builds the streamable-HTTP transport over `httpx2`.
# Both fail silently on an SDK line they were not written for (no App frames,
# no auth-status signal), so move this pin deliberately, with a test pass over
# them. See docs/kaizen/scoping/2026-10-17-mcp-sdk-v2-upgrade.md.
#
# `httpx2` / `httpcore2` / `truststore` are the 2.x transport's own
# dependencies (`mcp` asks only for `httpx2>=2.5.0`), pinned so the lock never
# drifts onto a release younger than two weeks.
#
# A constraint, not a dependency: it bounds the version IF the package is in
# the resolution graph, without adding it to our own dependency metadata.
# Asserted by backend/tests/supply_chain/test_strands_agentcore_pairing.py.
constraint-dependencies = [
    "mcp==2.1.1",
    "httpx2==2.13.1",
    "httpcore2==2.13.1",
    "truststore==0.10.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["agents*", "apis*"]

[tool.black]
line-length = 150
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
# pythonpath is relative to the directory where pytest is run (backend/)
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
