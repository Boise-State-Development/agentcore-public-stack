[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore-stack"
version = "1.20.0"
requires-python = ">=3.10"
description = "Multi-agent conversational AI system with AWS Bedrock AgentCore"
readme = "README.md"
license = {text = "MIT"}

# Core dependencies shared across both APIs
dependencies = [
    # FastAPI and web framework
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",

    # AWS and cloud services
    "boto3==1.43.68",

    # Utilities
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "aiofiles==25.1.0",

    # Authentication (for shared auth module)
    "pyjwt[crypto]==2.13.0",

    # OAuth provider management
    "authlib==1.7.1",
    "cachetools==6.2.4",

    # Security: pin starlette to fix Dependabot alert (transitive via fastapi)
    "starlette==1.3.1",

    # Security: pin transitive deps to fix Dependabot alerts
    "pillow==12.3.0",
    "cryptography==50.0.1",
    "python-multipart==0.0.31",
    "aiohttp==3.14.3",
    "urllib3==2.7.0",
    "idna==3.15",
    "pyasn1==0.6.4",
    "soupsieve==2.8.4",

    # PDF page-1 rasterization for attachment thumbnails (Apache 2.0 / BSD).
    # Bundles PDFium (no system poppler/ghostscript needed).
    "pypdfium2==4.30.0",

    # Web-source crawler: link extraction + main-content -> markdown.
    "beautifulsoup4==4.13.5",
    "trafilatura==2.0.0",
]

[project.optional-dependencies]
# AgentCore-specific dependencies (for inference_api)
agentcore = [
    "strands-agents==1.55.0",
    "strands-agents-tools==0.8.8",

    "aws-opentelemetry-distro==0.19.0",
    "bedrock-agentcore==1.21.0",
    # Multi-provider LLM support
    "openai==2.32.0",  # For OpenAI models
    "google-genai==1.73.1",  # For Google Gemini models
    # Mints Bedrock Mantle bearer tokens for Strands' bedrock_mantle_config
    # (OpenAIModel / OpenAIResponsesModel). Bounded >=1.1.0,<2.0.0 by strands.
    "aws-bedrock-token-generator==1.1.0",
]

# Voice/BidiAgent dependencies (Nova Sonic speech-to-speech)
bidi = [
    "strands-agents[bidi]==1.55.0",
]

# Document ingestion pipeline dependencies (for Lambda deployment)
# NOTE: For document ingestion dependencies, see:
#   backend/src/apis/app_api/documents/ingestion/requirements.txt
# This is the single source of truth for the Lambda deployment.
# For local development: uv pip install -r backend/src/apis/app_api/documents/ingestion/requirements.txt

# Development dependencies
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.152.3",
    "moto[dynamodb,cognitoidp]==5.1.22",
    "black==26.3.1",
    "ruff==0.15.12",
    "mypy==1.20.2",
    "types-aiofiles==25.1.0.20260409",
    "tiktoken==0.12.0",
    "numpy==2.2.6",
    # Exercises the fine-tuning dataset contract (manifest reading, label
    # normalisation, the image-archive path). The SageMaker containers install
    # their own unpinned pandas; 2.x is what the py3.10 text DLC resolves to,
    # and it is the only line compatible with the numpy pin above — pandas 3.x
    # requires numpy>=2.3.3 on py3.14+.
    "pandas==2.3.3",
]

# All dependencies (convenience)
all = [
    "agentcore-stack[agentcore,bidi,dev]",
]

[tool.uv]
# Guard rail on a TRANSITIVE dependency — this is not a loosened pin.
#
# `mcp` arrives only via `strands-agents`; we do not depend on it directly and
# deliberately do not promote it to a direct dependency. `strands-agents==1.55.0`
# — the version pinned above, today — already declares `mcp>=1.23.0,<2.2`, so
# the resolver is free to cross into `mcp` 2.x whenever it gets the chance.
#
# The ONLY thing holding us on the 1.x line right now is incidental: `mcp` 2.x
# pulls `httpx2>=2.5.0`, which needs `idna>=3.18`, and we pin `idna==3.15` for
# an unrelated Dependabot alert. A routine security bump of `idna` would quietly
# unblock the major crossing — nobody would be choosing it, and nothing in the
# diff would say "MCP".
#
# That crossing lands under `src/agents/main_agent/integrations/mcp_apps.py`,
# which substitutes `strands.tools.mcp.mcp_client.ClientSession` with
# `_UIExtensionClientSession` to advertise the MCP Apps UI extension (SEP-1865)
# on `initialize`. That seam reaches through a Strands internal into an MCP SDK
# class and has never been exercised against 2.x — where the transport
# dependency itself changed (httpx -> httpx2) and the types moved to a separate
# `mcp-types` distribution. The failure mode is silent: MCP App frame headers
# degrade to a generic glyph rather than raising an ImportError.
#
# A constraint, not a dependency: it bounds the version IF `mcp` is in the
# resolution graph, without adding it to our own dependency metadata. Lift it
# deliberately, together with a test pass over that `ClientSession` patch.
constraint-dependencies = ["mcp<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["agents*", "apis*"]

[tool.black]
line-length = 150
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
# pythonpath is relative to the directory where pytest is run (backend/)
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
